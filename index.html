<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<title>デイサービス / Dịch vụ ban ngày</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#17191c;--mut:#6d7580;--line:#e6eaf0;--ac:#2f6f6a;--ac2:#e7f3f1;--bad:#b3402d;--warn:#fff6e4;--wt:#7a5410;--sh:0 10px 28px rgba(22,34,51,.06);--r:22px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:22px 16px 128px}
h1{font-size:26px;line-height:1.2;margin:0}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=number],input[type=password],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd}
textarea{min-height:88px;resize:vertical}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.date{color:var(--mut);margin:2px 0 14px}
.vi,.kvi,.sub{color:var(--mut)}
.bi{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;gap:1px}
.bi .jp{font-weight:700}
.bi .vi{font-weight:500;color:var(--mut);font-size:.78em}
.btn .bi .jp,.btn .bi .vi,.nav button .jp,.nav button .vi{color:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--card);border-radius:var(--r);padding:20px 18px 16px;box-shadow:var(--sh);min-height:132px}
.stat .kjp{display:block;color:#66707c;font-size:14px}
.stat .kvi{display:block;color:#9aa3ae;font-size:12px;margin-top:2px}
.stat .num{font-size:40px;font-weight:700;letter-spacing:-.03em;margin-top:16px;line-height:1}
.stat .num small{font-size:20px;margin-left:2px;font-weight:700}
.stat .sub{margin-top:8px;font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
button.card{width:100%;text-align:left;border:0}
.biggo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:0;border-radius:var(--r);padding:16px 18px;margin-top:14px;box-shadow:var(--sh);color:inherit}
.biggo .bubble{width:52px;height:52px;border-radius:16px;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.biggo .jp{display:block;font-size:20px;font-weight:800}
.biggo .vi{display:block;font-size:13px}
.biggo .sub{display:block;font-size:12px;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.btn{min-height:44px;border-radius:12px;padding:8px 14px;border:1px solid transparent;background:var(--ac);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.btn.o{background:#fff;color:#245e59;border-color:#d5e4e1}
.btn.d{background:#fff;color:var(--bad);border-color:#f0c8c2}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;box-shadow:var(--sh);color:#243;display:flex;align-items:center;justify-content:center}
.warn{background:var(--warn);color:var(--wt);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14px}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tag{font-size:12px;border-radius:999px;padding:3px 8px;background:#f4f6f8;color:#445;white-space:nowrap}
.tag.red{background:#fdecea;color:var(--bad)}
.tag.amb{background:var(--warn);color:var(--wt)}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-width:44px;background:#fff;color:var(--tx);font-size:14px}
.days .vi{font-size:10px}
.row{display:grid;gap:6px;margin-bottom:8px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:#fbfcfd}
.link{background:none;border:0;color:var(--bad);padding:6px 0;justify-self:end}
.mut{color:var(--mut);font-size:14px}
.kv{margin:4px 0}
.rh{margin-top:6px;font-size:14px;white-space:pre-wrap;border-left:3px solid var(--ac);padding-left:8px}
.rn{white-space:pre-wrap;background:var(--warn);color:var(--wt);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.ride{display:grid;grid-template-columns:92px 1fr;gap:10px}
.ti{font-weight:800;color:var(--ac);text-align:center}
.namelist{list-style:none;padding:0;margin:8px 0}
.namelist li{padding:6px 0;border-bottom:1px solid #f0f2f5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;color:var(--mut);font-size:12px}
.cd{display:flex;flex-direction:column;align-items:center;padding:6px 0;border:0;border-radius:12px;background:#fff;box-shadow:var(--sh);min-height:52px;color:inherit}
.cd.on{outline:2px solid var(--ac)}
.cd span{font-size:11px;color:var(--ac)}
.files{display:grid;gap:10px}
.file{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:14px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#f3f5f7}
.fileic{display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px}
.file .bar{grid-column:1 / -1;margin:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.preview{position:sticky;top:8px;z-index:4;max-height:42vh;overflow:auto}
.jptext{white-space:pre-wrap;font-size:16px;line-height:1.7}
.vitext{white-space:pre-wrap;color:#3d4a44;background:#f4faf8;border-radius:12px;padding:10px;margin-top:8px;font-size:15px;line-height:1.65}
details{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:12px 0;padding:0 16px}
summary{cursor:pointer;font-weight:700;padding:14px 0}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details>div{padding-bottom:14px}
label.lb{display:block;margin:10px 0 4px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid #eceff3;padding:4px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(22,34,51,.04)}
.nav button{flex:1;min-width:0;background:transparent;border:0;color:#8b919a;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 1px 2px;min-height:62px}
.nav button .jp{font-size:10px;font-weight:700}
.nav button .vi{font-size:8px;font-weight:600;line-height:1.15;max-width:100%;text-align:center}
.nav button.on{color:#17191c}
.nav svg,.bubble svg,.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.modal{display:none;position:fixed;inset:0;z-index:40;background:rgba(20,24,28,.45);padding:18px;overflow:auto}
.modal.show{display:flex;align-items:flex-start;justify-content:center}
.modalcard{background:#fff;border-radius:18px;padding:14px;max-width:920px;width:100%;margin-top:20px}
.modalcard img{max-width:100%;border-radius:12px}
.modalcard iframe{width:100%;height:70vh;border:0;border-radius:12px;background:#f4f5f7}
.empty{padding:6px 0}
.center{text-align:center}
.feegrid{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:14px}
.tot{font-size:20px;font-weight:800;margin-top:8px}

.sw{-webkit-appearance:none;appearance:none;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:64px;margin:0;padding:14px 16px;border:0;border-radius:22px;background:#fff;box-shadow:var(--sh);text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sw .track{width:56px;height:32px;border-radius:999px;background:#c5ced6;position:relative;flex:0 0 auto}
.sw.on .track{background:var(--ac)}
.sw .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.sw.on .knob{left:27px}
.card>.sw{box-shadow:none;background:#f3f6f8;margin:8px 0 0}
.swDock{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:24;padding:0 12px}
.swDock .sw{max-width:880px;margin:0 auto}
.swSpace{height:84px}
@media(max-width:380px){.stats{gap:8px}.stat{padding:14px 12px}.stat .num{font-size:32px}.ride{grid-template-columns:76px 1fr}}
@media(min-width:900px){main{padding:32px 20px 128px}.stat .num{font-size:44px}}
@media print{
  .noprint,.nav,.modal{display:none!important}
  body.nofee .fee{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .card,details,.stat{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>
<div id="stw" class="warn noprint" style="display:none"></div>
<main id="app"></main>
<nav id="nav" class="nav noprint" aria-label="メインメニュー / Menu chính"></nav>
<div id="modal" class="modal noprint" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modalcard" role="dialog" aria-modal="true">
    <div class="bar"><button type="button" class="btn o" onclick="closeModal()"><span class="bi"><span class="jp">閉じる</span><span class="vi">Đóng</span></span></button></div>
    <div id="modalbody"></div>
  </div>
</div>
<script>
var KEY="kaigo_v1", PK="kaigo_pin", MAX_FILE=4*1024*1024;
var DAYS=["月","火","水","木","金","土","日"];
var DOW_VI=["T2","T3","T4","T5","T6","T7","CN"];
var DOW_VI_L=["thứ Hai","thứ Ba","thứ Tư","thứ Năm","thứ Sáu","thứ Bảy","Chủ nhật"];
var _seq=0;
var locked=false;
var S={list:[],cur:null,q:"",del:false,tab:"home",rd:"",rv:"day",msg:"",cf:0,fileMsg:"",renUid:"",renDate:"",logDate:"",prev:"home",rc:0,lq:""};
var REN={season:"",weather:"",holiday:"",appetite:"",temp:"",bp:"",pain:"",painWhere:"",sleep:"",mood:"",rec:"",recNote:"",bath:"",urine:"",stool:"",place:"",assist:"",meal:"",water:"",med:"",rehab:"",rehabNote:"",family:"",tomorrow:"",tomorrowNote:"",open:"",close:"",pat:0};
var ORD={}, PLAN={};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bi(jp,vi){return '<span class="bi"><span class="jp">'+jp+'</span><span class="vi">'+vi+'</span></span>'}
function cloudSched(){}
function ds(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function pd(x){return new Date(String(x).slice(0,10)+"T00:00:00")}
function wi(d){return (d.getDay()+6)%7}
function fileTooBig(size){return (Number(size)||0) > MAX_FILE}
function yen(n){return "¥"+new Intl.NumberFormat("ja-JP").format(Math.round(Number(n)||0))}
function yenVi(n){return new Intl.NumberFormat("vi-VN").format(Math.round(Number(n)||0))+" yên"}
function num(v){return Number(v)||0}
function jpDate(iso){var d=pd(iso); if(isNaN(d.getTime())) return ""; return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日（"+DAYS[wi(d)]+"）"}
function viDate(iso){var d=pd(iso); if(isNaN(d.getTime())) return ""; return "ngày "+d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()+" ("+DOW_VI_L[wi(d)]+")"}
function age(b){
  if(!b) return "";
  var d=pd(b), n=new Date();
  if(isNaN(d.getTime())) return "";
  var a=n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate()<d.getDate())) a--;
  if(isNaN(a)||a<0||a>130) return "";
  return a+"歳 / "+a+" tuổi";
}
function certDays(r){
  if(!r || !r.certEnd) return null;
  var a=pd(String(r.certEnd).slice(0,10)), b=pd(ds(new Date()));
  if(isNaN(a.getTime())) return null;
  return Math.round((a-b)/864e5);
}
function blank(){
  _seq++;
  return {id:Date.now()+_seq,name:"",kana:"",gender:"",birth:"",address:"",phone:"",level:"",copay:"",certEnd:"",cm:"",cmTel:"",illness:"",allergy:"",meds:[],caution:"",clothes:"",hobby:"",dislike:"",history:"",family:"",contacts:[],days:[],pick:"",ret:"",stay:"",transport:"",fee:"",feeMeal:"",feeNight:"",extras:[],note:"",stayDays:[],flags:[],blood:"",hospital:"",diet:"",walk:"",lang:"",logs:[],meals:"",nights:"",kasan:"",cond:"",map:"",keikaku:"",careFiles:[]};
}
function fix(){
  var i,x,b,k,arr=["meds","contacts","days","extras","stayDays","flags","logs","careFiles"];
  for(i=0;i<S.list.length;i++){
    x=S.list[i]; if(!x || typeof x!=="object"){S.list[i]=blank(); x=S.list[i]}
    b=blank();
    for(k in b){ if(!(k in x)) x[k]=b[k]; }
    if(!x.id) x.id=b.id;
    arr.forEach(function(a){ if(!Array.isArray(x[a])) x[a]=[]; });
    if(typeof x.keikaku!=="string") x.keikaku = x.keikaku ? String(x.keikaku) : "";
  }
}
function warnSt(){
  var e=$("stw");
  if(!e) return;
  e.style.display="block";
  e.innerHTML='<b>この端末はページの保存を拒否しています。 / Máy này không cho trang lưu dữ liệu.</b><br>入力は閉じると消えます。Safariで開き、プライベートブラウズを切って、再読み込みしてください。設定からバックアップをコピーしてください。<br>Nội dung sẽ mất khi thoát. Hãy mở bằng Safari, tắt duyệt riêng tư, rồi tải lại. Vào Cài đặt và chép bản sao lưu.';
}
function stOK(){try{localStorage.setItem("kg_t","1"); var r=localStorage.getItem("kg_t")==="1"; localStorage.removeItem("kg_t"); return r}catch(e){return false}}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S.list)); return true; }
  catch(e){ warnSt(); return false; }
}
function ordLoad(){try{var o=JSON.parse(localStorage.getItem("kaigo_ord")||"{}"); return o&&typeof o==="object"?o:{}}catch(e){return {}}}
function ordSave(){try{localStorage.setItem("kaigo_ord", JSON.stringify(ORD))}catch(e){}}
function plLoad(){try{var o=JSON.parse(localStorage.getItem("kaigo_plan")||"{}"); return o&&typeof o==="object"?o:{}}catch(e){return {}}}
function plSave(){try{localStorage.setItem("kaigo_plan", JSON.stringify(PLAN))}catch(e){}}

var SHOW_KEY="kaigo_shownames";
var showNames=false;
function loadShow(){ try{ showNames=localStorage.getItem(SHOW_KEY)==="1"; }catch(e){ showNames=false; } }
function saveShow(){ try{ localStorage.setItem(SHOW_KEY, showNames?"1":"0"); }catch(e){} }
function toggleNames(){ showNames=!showNames; saveShow(); render(); }
function userNo(x){
  var i, n;
  if(!x) return 1;
  n=+x.id;
  for(i=0;i<S.list.length;i++) if(S.list[i] && (S.list[i].id===n || S.list[i].id===x.id)) return i+1;
  return 1;
}
function dispName(x){
  if(!x) return {jp:"?", vi:"?"};
  if(showNames){
    if(x.name) return {jp:x.name, vi:x.name};
    return {jp:"名前なし", vi:"Chưa có tên"};
  }
  var no=userNo(x);
  return {jp:"利用者 "+no, vi:"Người "+no};
}
function nameText(x){
  var d=dispName(x);
  if(showNames && x && x.name) return x.name;
  return d.jp+" / "+d.vi;
}
function shownNote(text, x, lang){
  if(text==null) return "";
  var s=String(text);
  if(showNames || !x || !x.name) return s;
  var d=dispName(x);
  return s.split(x.name).join(lang==="vi"?d.vi:d.jp);
}
function nameSwitch(){
  return '<button type="button" class="sw'+(showNames?" on":"")+'" role="switch" aria-checked="'+(showNames?"true":"false")+'" onclick="toggleNames()"><span class="bi"><span class="jp">名前を表示</span><span class="vi">Hiện tên</span></span><span class="track" aria-hidden="true"><span class="knob"></span></span></button>';
}

function byId(id){
  var n=+id, i;
  for(i=0;i<S.list.length;i++){
    if(S.list[i] && (S.list[i].id===n || S.list[i].id===id)) return S.list[i];
  }
  return null;
}
function cur(){return byId(S.cur)}
function sorted(L, key){
  var o=ORD[key]||[];
  return L.slice().sort(function(a,b){
    var i=o.indexOf(a.id), j=o.indexOf(b.id);
    if(i>=0 && j>=0) return i-j;
    if(i>=0) return -1;
    if(j>=0) return 1;
    var ta = key==="stay" || key==="stayDays" ? (a.kana||a.name||"") : (a[key]||"99");
    var tb = key==="stay" || key==="stayDays" ? (b.kana||b.name||"") : (b[key]||"99");
    return String(ta).localeCompare(String(tb), "ja");
  });
}
function clean(list){
  var seen={}, out=[], i, e;
  for(i=0;i<(list||[]).length;i++){
    e=list[i];
    if(!e || !byId(e.id) || seen[+e.id]) continue;
    seen[+e.id]=1;
    out.push({id:+byId(e.id).id, t:e.t||""});
  }
  return out;
}
function baseList(D, arrKey, timeKey){
  var w=DAYS[wi(pd(D))];
  var L=S.list.filter(function(x){return x && (x[arrKey]||[]).indexOf(w)>=0});
  L=sorted(L, timeKey||arrKey);
  return L.map(function(x){
    return {id:x.id, t: (timeKey && timeKey!=="stay") ? (x[timeKey]||"") : ""};
  });
}
function touch(D){ if(!PLAN[D] || typeof PLAN[D]!=="object" || Array.isArray(PLAN[D])) PLAN[D]={}; return PLAN[D]; }
function pickCustom(D){return !!(PLAN[D] && Array.isArray(PLAN[D].pick))}
function stayCustom(D){return !!(PLAN[D] && Array.isArray(PLAN[D].stay))}
function retCustom(D){return !!(PLAN[D] && Array.isArray(PLAN[D].ret))}
function getPick(D){
  if(pickCustom(D)) return clean(PLAN[D].pick);
  return clean(baseList(D,"days","pick"));
}
function getStay(D){
  if(stayCustom(D)) return clean(PLAN[D].stay);
  return clean(baseList(D,"stayDays","stay"));
}
function getRet(D){
  var pick=getPick(D), stay={}, people, order, time={}, idx={}, has={}, out;
  getStay(D).forEach(function(e){stay[e.id]=1});
  people=pick.filter(function(e){return !stay[e.id]});
  order=(PLAN[D] && Array.isArray(PLAN[D].ret)) ? PLAN[D].ret : [];
  order.forEach(function(e,i){
    if(!e) return;
    has[+e.id]=1; time[+e.id]=e.t||""; idx[+e.id]=i;
  });
  out=people.map(function(e,i){
    var x=byId(e.id);
    var t=(has[e.id] && time[e.id]) ? time[e.id] : ((x && x.ret) || "");
    return {id:e.id, t:t, _i:i};
  });
  if(order.length){
    out.sort(function(a,b){
      var ia = Object.prototype.hasOwnProperty.call(idx, a.id) ? idx[a.id] : 10000+a._i;
      var ib = Object.prototype.hasOwnProperty.call(idx, b.id) ? idx[b.id] : 10000+b._i;
      return ia-ib;
    });
  }
  return out.map(function(e){return {id:e.id, t:e.t}});
}
function ensurePick(D){
  var P=touch(D);
  if(!Array.isArray(P.pick)) P.pick=baseList(D,"days","pick").map(function(e){return {id:e.id, t:e.t||""}});
  return P.pick;
}
function ensureStay(D){
  var P=touch(D);
  if(!Array.isArray(P.stay)) P.stay=baseList(D,"stayDays","stay").map(function(e){return {id:e.id, t:e.t||""}});
  return P.stay;
}
function ensureRet(D){
  var list=getRet(D).map(function(e){return {id:e.id, t:e.t||""}});
  touch(D).ret=list;
  return list;
}
function indexOfId(P,id){var i; for(i=0;i<P.length;i++) if(P[i] && +P[i].id===+id) return i; return -1}
function listOf(key){
  if(key==="stay") return ensureStay(S.rd);
  if(key==="ret") return ensureRet(S.rd);
  return ensurePick(S.rd);
}

  var D=pd(S.rd), m=D.getMonth(), n=0, d, k;

function addCareFiles(input){
  var uid=S.cur, r=byId(uid);
  if(!r) return;
  if(!Array.isArray(r.careFiles)) r.careFiles=[];
  var files=[].slice.call(input.files||[]), skipped=[], queue=[], i;
  input.value="";
  for(i=0;i<files.length;i++){
    if(fileTooBig(files[i].size)) skipped.push(files[i].name||"file");
    else queue.push(files[i]);
  }
  var pending=queue.length, added=[];
  function finish(){
    if(!added.length){
      S.fileMsg = skipped.length ? ("4MBを超えるため追加しませんでした: "+skipped.join(", ")+"\nTệp trên khoảng 4MB đã bỏ qua: "+skipped.join(", ")) : "";
      if(S.cur===uid) detail();
      return;
    }
    var snapshot=r.careFiles.slice();
    added.forEach(function(it){ r.careFiles.push(it); });
    if(!save()){
      r.careFiles=snapshot;
      S.fileMsg="容量がいっぱいです。ファイルを追加できませんでした。\nBộ nhớ trình duyệt đã đầy. Không thêm được tệp.";
    } else if(skipped.length){
      S.fileMsg="追加して保存しました。ただし4MB超はスキップ: "+skipped.join(", ")+"\nĐã thêm và lưu. Đã bỏ tệp trên khoảng 4MB: "+skipped.join(", ");
    } else S.fileMsg="追加して保存しました。\nĐã thêm và lưu.";
    if(S.cur===uid && S.tab==="users") detail();
  }
  if(!pending){ finish(); return; }
  queue.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      added.push({name:f.name||"file", type:f.type||"", data:String(rd.result||""), size:f.size||0});
      if(--pending===0) finish();
    };
    rd.onerror=function(){
      skipped.push(f.name||"file");
      if(--pending===0) finish();
    };
    rd.readAsDataURL(f);
  });
}
function rmCare(i){
  var r=cur(); if(!r||!r.careFiles||!r.careFiles[i]) return;

    S.fileMsg="削除を保存できませんでした。\nKhông lưu được thao tác xóa.";
  } else S.fileMsg="削除して保存しました。\nĐã xóa và lưu.";

}

function getPin(){try{return localStorage.getItem(PK)}catch(e){return null}}
function h256(x){return crypto.subtle.digest("SHA-256", new TextEncoder().encode("kg"+x)).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf), function(v){return ("0"+v.toString(16)).slice(-2)}).join("")})}
function lockScreen(){
  $("app").innerHTML='<div class="card" style="margin-top:28px"><h2>'+bi("PINを入力","Nhập mã PIN")+'</h2><input type="password" inputmode="numeric" id="pin" placeholder="PIN / Mã PIN" autocomplete="off"><div class="bar"><button type="button" class="btn" onclick="tryPin()">'+bi("開く","Mở khóa")+'</button></div><div class="mut" id="pm"></div><p class="note">忘れた場合はバックアップが必要です。 / Nếu quên, cần bản sao lưu.</p></div>';
  var p=$("pin"); if(p) p.onkeydown=function(e){ if(e.key==="Enter") tryPin(); };
}
function tryPin(){
  var el=$("pin"); if(!el) return;
  h256(el.value).then(function(h){
    if(h===getPin()){ locked=false; render(); }
    else { var m=$("pm"); if(m) m.textContent="PINが違います。 / Sai mã PIN."; }
  }).catch(function(){ var m=$("pm"); if(m) m.textContent="この端末ではPINを確認できません。 / Máy này không kiểm tra được PIN."; });
}
function setPin(){
  var v=$("np")?$("np").value:"", pn=$("pn");
  if(!/^[0-9]{4,8}$/.test(v)){ if(pn) pn.textContent="4〜8桁の数字です。 / Nhập 4 đến 8 chữ số."; return; }
  h256(v).then(function(h){
    try{ localStorage.setItem(PK, h); }catch(e){ if(pn) pn.textContent="保存できません。 / Không lưu được."; return; }
    S.msg="PINを設定しました。\nĐã đặt PIN.";
    settings();
  }).catch(function(){ if(pn) pn.textContent="この端末ではPINを設定できません。 / Máy này không đặt được PIN."; });
}
function clearPin(){ try{localStorage.removeItem(PK)}catch(e){} S.msg="PINをオフにしました。\nĐã tắt PIN."; settings(); }

function greetCtx(){
  return {w:REN.weather||"", s:REN.season||"", h:REN.holiday||"", tom:REN.tomorrow||"", stay:renStaying()};
}
function renStaying(){
  var x, st, i;
  if(REN.tomorrow==="お泊まり") return true;
  x=byId(S.renUid);
  if(!x || !S.renDate) return false;
  st=getStay(S.renDate);
  for(i=0;i<st.length;i++) if(st[i] && +st[i].id===+x.id) return true;
  return false;
}
function lineOk(line, ctx){
  if(line.home && ctx.stay) return false;
  if(line.stay && !ctx.stay) return false;
  if(line.w && line.w!==ctx.w) return false;
  if(line.s && line.s!==ctx.s) return false;
  if(line.hol && !ctx.h) return false;
  if(line.tom && line.tom!==ctx.tom) return false;
  return true;
}
function lineBucket(line){
  if(line.hol) return 0;
  if(line.w) return 1;
  if(line.tom) return 2;
  if(line.s) return 3;
  if(line.home || line.stay) return 4;
  return 5;
}
function poolOf(lines, ctx){
  var g=[[],[],[],[],[],[]], i, pool=[], line, signals=[];
  for(i=0;i<lines.length;i++){
    line=lines[i];
    if(!lineOk(line, ctx)) continue;
    g[lineBucket(line)].push(line);
  }
  if(ctx.h && g[0].length) signals.push(g[0]);
  if((ctx.w || ctx.s) && g[1].length) signals.push(g[1]);
  if(ctx.tom && g[2].length) signals.push(g[2]);
  if(ctx.s && g[3].length && !g[1].length) signals.push(g[3]);
  for(i=0;i<signals.length;i++) pool=pool.concat(signals[i]);
  if(!pool.length) pool=g[4].length?g[4].slice():(g[5].length?g[5].slice():lines.slice());
  return pool;
}
function pickFrom(lines, salt){
  var pool=poolOf(lines, greetCtx()), s, h=0, i, pat;
  s=String(S.renUid||"")+"|"+String(S.renDate||"")+"|"+salt+"|"+String(REN.pat||0);
  for(i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))>>>0;
  pat=((Number(REN.pat)||0)%12+12)%12;
  return pool[(h+pat)%pool.length];
}
function greetLine(lines, key){
  var id=REN[key]||"", i;
  if(id){ for(i=0;i<lines.length;i++) if(lines[i].id===id) return lines[i]; }
  return pickFrom(lines, key);
}
function fillGreet(line, x){
  var d=dispName(x), h=holBy(REN.holiday);
  var nm=(showNames && x && x.name)?x.name:(showNames?"ご利用者":d.jp);
  var nmVi=(showNames && x && x.name)?x.name:(showNames?"người sử dụng":d.vi);
  var hj=h?h[0]:"今日の行事", hv=h?h[1]:"sự kiện hôm nay";
  return {
    jp:String(line.jp).split("{名}").join(nm).split("{行事}").join(hj),
    vi:String(line.vi).split("{名}").join(nmVi).split("{行事}").join(hv)
  };
}

function suggestHol(iso){
  var d=pd(iso); if(isNaN(d.getTime())) return "";
  var m=d.getMonth()+1, day=d.getDate(), w=d.getDay(), y=d.getFullYear();
  var eq={2024:22,2025:23,2026:23,2027:23,2028:22,2029:23,2030:23,2031:23,2032:22,2033:23,2034:23,2035:23};
  if(m===1 && day===1) return "元日";
  if((m===12 && day>=29) || (m===1 && day<=3)) return "正月";
  if(m===1 && w===1 && day>=8 && day<=14) return "成人の日";
  if(m===2 && day===3) return "節分";
  if(m===3 && day===3) return "ひな祭り";
  if((m===3 && day>=25) || (m===4 && day<=10)) return "花見";
  if(m===5 && day===5) return "子どもの日";
  if(m===6) return "梅雨";
  if(m===7 && day===7) return "七夕";
  if(m===8 && day>=13 && day<=16) return "お盆";
  if((m===7 && day>=20) || (m===8 && day<=25)) return "猛暑";
  if(m===9 && w===1 && day>=15 && day<=21) return "敬老の日";
  if(m===9 && (eq[y] ? eq[y]===day : (day===22 || day===23))) return "秋分";
  if(m===11 && day===3) return "文化の日";
  if(m===11 && day===15) return "七五三";
  if(m===11) return "紅葉";
  if(m===12 && day===25) return "クリスマス";
  if(m===12 || m===1 || m===2) return "冬";
  return "";
}

function onEdit(e){
  var t=e.target;
  if(!t || !t.dataset) return;
  if(t.dataset.ren){
    REN[t.dataset.ren]=t.type==="checkbox" ? (t.checked?"1":"") : t.value;
    updatePreview();
    return;
  }
  if(t.dataset.log && t.dataset.uid){
    var xu=byId(t.dataset.uid), i=+t.dataset.i;
    if(xu && xu.logs && xu.logs[i]){
      xu.logs[i][t.dataset.log]=t.type==="checkbox"?t.checked:t.value;
      save();
    }
    return;
  }
  if(t.dataset.fee && t.dataset.k){
    var fu=byId(t.dataset.fee);
    if(fu){
      fu[t.dataset.k]=t.value;
      save();
      var month=ds(new Date()).slice(0,7);
      var sEl=$("sub_"+fu.id);
      if(sEl) sEl.textContent=yen(userMonthFee(fu, month));
      var g=$("feeGrand"); if(g) g.textContent=yen(monthFees(month));
      var gv=$("feeGrandVi"); if(gv) gv.textContent=yenVi(monthFees(month));
    }
    return;
  }
  var r=cur();
  if(!r) return;
  if(t.dataset.arr){
    if(!Array.isArray(r[t.dataset.arr])) r[t.dataset.arr]=[];
    var a=r[t.dataset.arr], ix=a.indexOf(t.dataset.v);
    if(t.checked && ix<0) a.push(t.dataset.v);
    if(!t.checked && ix>=0) a.splice(ix,1);
  } else if(t.dataset.l){
    if(!r[t.dataset.l][+t.dataset.i]) return;
    r[t.dataset.l][+t.dataset.i][t.dataset.k]=t.type==="checkbox"?t.checked:t.value;
  } else if(t.dataset.k){
    r[t.dataset.k]=t.value;
  } else return;
  save();
  sum(r);
}
function render(){
  if(!$("app")) return;
  if(locked){ lockScreen(); setNav(); return; }
  if(S.tab==="users" && S.cur) detail();
  else if(S.tab==="users") users();
  else if(S.tab==="logs") logs();
  else if(S.tab==="ren") ren();
  else if(S.tab==="stay") stay();
  else if(S.tab==="ride") ride();
  else if(S.tab==="fee") fee();
  else if(S.tab==="set") settings();
  else home();
  setNav();
}
document.addEventListener("input", onEdit);
document.addEventListener("change", onEdit);
document.addEventListener("visibilitychange", function(){ if(document.hidden && getPin()){ locked=true; render(); } });

locked=!!getPin();
if(!stOK()) warnSt();
render();
